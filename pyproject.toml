[project]
name = "grida-models-tooling"
version = "0.0.0"
description = "Validation tooling for the Grida model catalogue. Not a published package."
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
