name: release

# Publishes a versioned snapshot of catalogue/ as a GitHub Release whenever its content
# changes on main, then publishes that release to npm as @grida/ai-models through trusted
# publishing (OIDC; no stored token). On pull requests it builds the same snapshot and npm
# package as a preview artifact and publishes nothing. See scripts/release.py.

on:
  push:
    branches: [main]
    paths: ["catalogue/**"]
  pull_request:
    paths: ["catalogue/**", "scripts/release.py", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Releases on main run one at a time, so version numbers never collide.
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the next version number

      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked

      - name: Validate catalogue
        run: uv run scripts/check.py

      - name: Download the latest release
        run: |
          mkdir -p previous
          # Every JSON asset: the manifest, models and labs under current or earlier names.
          gh release download --dir previous --pattern '*.json' || echo "No previous release."

      - name: Compare with the latest release
        id: compare
        run: |
          digest="$(uv run scripts/release.py digest)"
          previous="$(jq -r '.digest // empty' previous/manifest.json 2>/dev/null || true)"
          if [ "$digest" = "$previous" ]; then
            echo "Catalogue unchanged since the latest release ($digest)."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build snapshot
        # Pull requests always build, so changes to the release tooling are exercised too.
        if: steps.compare.outputs.changed == 'true' || github.event_name == 'pull_request'
        id: build
        run: |
          version="$(uv run scripts/release.py version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          uv run scripts/release.py build --version "$version" --out dist
          uv run scripts/release.py notes --version "$version" --previous previous > notes.md
          uv run scripts/release.py npm --archive "dist/grida-models-$version.tar.gz" --out npm-package
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview
        if: steps.build.outputs.version && env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-preview
          path: |
            dist/
            npm-package/
            notes.md

      - name: Publish release
        if: steps.compare.outputs.changed == 'true' && env.PUBLISH == 'true'
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          gh release create "$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            --latest

  npm:
    # Publishes the latest release to npm unless npm already has it, so a failed or skipped
    # publish is caught up by the next run. The package is built from the release's own
    # archive, so it holds exactly what was released.
    needs: snapshot
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    env:
      GH_TOKEN: ${{ github.token }}
      NPM_PACKAGE: "@grida/ai-models" # NPM_NAME in scripts/release.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; pin it rather than rely on Node's bundled npm.
      - run: npm install --global npm@11.21.0

      - name: Find the latest release
        id: latest
        run: |
          tag="$(gh release view --json tagName --jq .tagName)"
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$(npm view "$NPM_PACKAGE@$version" version 2>/dev/null)" = "$version" ]; then
            echo "$NPM_PACKAGE@$version is already on npm."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.latest.outputs.publish == 'true'
        env:
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern "grida-models-$TAG.tar.gz" --dir release
          uv run scripts/release.py npm --archive "release/grida-models-$TAG.tar.gz" --out package

      - name: Publish to npm
        if: steps.latest.outputs.publish == 'true'
        run: |
          # A version npm already has is success: right after a publish, `npm view` above can
          # still report it missing while the registry's cache catches up.
          set -o pipefail
          if ! npm publish ./package --access public 2>&1 | tee publish.log; then
            grep -q "cannot publish over the previously published versions" publish.log || exit 1
            echo "$NPM_PACKAGE is already published at this version."
          fi

      - name: Refresh the CDN
        if: steps.latest.outputs.publish == 'true'
        run: |
          # jsDelivr caches the `@<major>` alias for hours; ask it to resolve the new version now.
          # Wait until the registry serves the new version first: a refresh before then resolves
          # the alias to the previous version and caches that again.
          version="$(jq -r .version package/package.json)"
          for attempt in $(seq 1 20); do
            [ "$(npm view "$NPM_PACKAGE" dist-tags.latest --prefer-online 2>/dev/null)" = "$version" ] && break
            sleep 15
          done
          major="${version%%.*}"
          for file in models.json labs.json manifest.json; do
            curl -fsS "https://purge.jsdelivr.net/npm/$NPM_PACKAGE@$major/$file" > /dev/null \
              || echo "Could not refresh $file; jsDelivr will pick it up within hours."
          done
