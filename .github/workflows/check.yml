name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # exact PR base/head comparisons for schema history
      - name: Require schema changelog coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_changelog.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Validate catalogue
        run: uv run scripts/check.py
      - name: Test checker
        run: uv run pytest

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # oxfmt runs through npx; there is no package.json. Keep the version in sync with AGENTS.md.
      - name: Check formatting
        run: npx -y oxfmt@0.71.0 --check
