"image_seed" = { "type" = "integer" }
"model" = { "type" = "string", "enum" = ["v3.1-20260211"] }
"model_seed" = { "type" = "integer" }
"negative_prompt" = { "type" = "string", "max_length" = 255 }
"pbr" = { "type" = "boolean" }
"prompt" = { "type" = "string", "max_length" = 1024 }
"quad" = { "type" = "boolean" }
"smart_low_poly" = { "type" = "boolean" }
"texture" = { "type" = "boolean" }
