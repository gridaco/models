"export_uv" = { "type" = "boolean" }
"face_limit" = { "type" = "integer", "minimum" = 48, "maximum" = 50000 }
"input" = { "type" = "string" }
"model" = { "type" = "string", "enum" = ["P2-20260801"] }
"model_seed" = { "type" = "integer" }
"pbr" = { "type" = "boolean" }
"quad" = { "type" = "boolean" }
"texture" = { "type" = "boolean" }
"texture_quality" = { "type" = "string", "enum" = ["fast", "standard", "detailed", "extreme"] }
"texture_seed" = { "type" = "integer" }
"texture_version" = { "type" = "string", "enum" = [
  "v3.5-20260815",
  "v3.0-20250812",
  "v2.5-20250123",
] }

[[endpoints]]
id = "/generation/multiview-to-model"
