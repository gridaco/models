[providers.google]
provider = "google"
id = "gemini-decision-1"
url = "https://aistudio.google.com/docs/models/gemini-decision-1"
source_url = "https://aistudio.google.com/docs/decisions-api"
qualifications = [
  { source_url = "https://aistudio.google.com/docs/models/gemini-decision-1", notes = "Google describes a specialized multimodal model for the Decisions API without naming an underlying model. No parent relationship or inherited chat capabilities are recorded." },
  { source_url = "https://aistudio.google.com/docs/decisions-api", notes = "The native v1beta Decisions API accepts input as a string, Content or Content[], with text, image, audio, video and PDF blocks, and questions/answers keyed by name. The structured input and Google's low/medium/high/ultra_high resolution vocabulary are not fully represented by decision_contract's existing shorthand. Raw inline base64, Files API URIs and public or signed HTTPS URLs are distinct native transports; no OpenAI image-form list is substituted." },
  { source_url = "https://aistudio.google.com/docs/pricing", notes = "Standard paid input is USD 0.10 per million tokens across all supported modalities. Shared input is billed once; question instructions, criteria and formatting add input tokens. Output pricing is not applicable because output usage is zero; context caching is unavailable. Inapplicable output/cache rates are omitted, rather than recorded as free generation or caching." },
  { source_url = "https://aistudio.google.com/docs/decisions-api", notes = "Questions require text instructions. Choice criteria use string keys; score criteria are ordered rubric levels. Confidence and probability semantics belong to this native interface and require thresholds calibrated on the consumer's own examples. Blocked input returns a request-level HTTP 400; no per-question refusal contract is recorded." },
]

[providers.google.token_pricing]
source_url = "https://aistudio.google.com/docs/pricing"
unit = "usd_per_token"
scope = "Standard paid Decisions input across text, image, video, audio and PDF; shared input counted once plus question tokens. Output pricing is inapplicable and context caching is unavailable."
input = "0.0000001"

