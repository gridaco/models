  { source_url = "https://openrouter.ai/api/v1/models/google/gemini-decision-1/endpoints", notes = "The model page and Google AI Studio endpoint establish availability even though the general /api/v1/models feed does not list this alpha model. The endpoint publishes context 262144, regular input USD 0.0000001/token and completion zero with discount zero. Generic tool-choice, web-search price and positive max-completion metadata do not establish native Decisions tools, output generation or additional charges; cache rates and unrecorded bands remain omitted." },
]

