  { source_url = "https://vercel.com/changelog/gemini-decision-1-now-available-on-ai-gateway", notes = "Gemini Decision 1 is available through Vercel's Decisions API, TypeSafe-compatible API and AI SDK. The listed decisions endpoint records the OpenAI-compatible text/image facade; PDF/audio/video input is documented through AI SDK 7 and is not claimed for that endpoint." },
  { source_url = "https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-decisions", notes = "The compatible facade uses predicate/choice/score question arrays and string or user-message input, rather than Google's native noul/named-map/Content envelope. It requires inline image data URLs, accepts one to 255 choices and two to ten score levels, and rejects boolean/string spelling collisions. The source documents per-question refusal positions and input billing; this does not promise that native Google safety errors become partial refusals." },
  { source_url = "https://ai-gateway.vercel.sh/v1/models/google/gemini-decision-1/endpoints", notes = "The Google endpoint publishes a 262144-token context, input USD 0.0000001/token, zero completion cost and no implicit caching, with discount zero. Generic reasoning, sampling and max_tokens metadata is not a Decisions capability contract; native chat controls and extra zero-priced generation/tool meters are not inherited." },
]

