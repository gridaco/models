id = "anthropic/claude-haiku-5.5"
section = "text.catalog"
vendor = "anthropic"

label = "Claude Haiku 5.5"
short_label = "Haiku 5.5"
multimodal = true
image_input_mimes = ["image/jpeg", "image/png", "image/gif", "image/webp"]
tool_call = true
context_window = 1_000_000
output_limit = 128_000

[release]
date = "2026-10-07"
basis = "model"
source_url = "https://platform.claude.com/docs/en/models/haiku-5-5/overview"

# Priced by prompt length: a request whose prompt (all input tokens, cache reads and writes
# included) is over 100,000 tokens pays 5x on every rate, cache reads and writes included.
[cost]
input = 0.1
output = 0.5
cache_read = 0.01
cache_write = 0.125

[cost.long_context]
input_tokens_above = 100_000
input_multiplier = 5
output_multiplier = 5

[providers.vercel]
provider = "vercel"
id = "anthropic/claude-haiku-5.5"
url = "https://ai-gateway.vercel.sh/v1/models"
endpoints = [
  { id = "anthropic/claude-haiku-5.5", input = "text", source_url = "https://ai-gateway.vercel.sh/v1/models" },
]

[providers.vercel.token_pricing]
source_url = "https://ai-gateway.vercel.sh/v1/models"
unit = "usd_per_token"
input = "0.0000001"
output = "0.0000005"
input_cache_read = "0.00000001"
input_cache_write = "0.000000125"
tiers = [
  { "meter" = "input", "minimum_input_tokens" = 0, "usd_per_token" = "0.0000001", "maximum_input_tokens" = 100001 },
  { "meter" = "input", "minimum_input_tokens" = 100001, "usd_per_token" = "0.0000005" },
  { "meter" = "output", "minimum_input_tokens" = 0, "usd_per_token" = "0.0000005", "maximum_input_tokens" = 100001 },
  { "meter" = "output", "minimum_input_tokens" = 100001, "usd_per_token" = "0.0000025" },
  { "meter" = "input_cache_read", "minimum_input_tokens" = 0, "usd_per_token" = "0.00000001", "maximum_input_tokens" = 100001 },
  { "meter" = "input_cache_read", "minimum_input_tokens" = 100001, "usd_per_token" = "0.00000005" },
  { "meter" = "input_cache_write", "minimum_input_tokens" = 0, "usd_per_token" = "0.000000125", "maximum_input_tokens" = 100001 },
  { "meter" = "input_cache_write", "minimum_input_tokens" = 100001, "usd_per_token" = "0.000000625" },
]

[providers.vercel.capabilities]
source_url = "https://ai-gateway.vercel.sh/v1/models"
image_input = true
tools = true
reasoning = true
structured_output = true

[providers.vercel.limits]
source_url = "https://ai-gateway.vercel.sh/v1/models"
context_tokens = 1000000
max_output_tokens = 128000

[vision_tokenization]
source_url = "https://platform.claude.com/docs/en/build-with-claude/vision"
patch_size_px = 28
maximum_tokens_per_image = 4784
detail_maximum_edges = { "default" = 2576 }
