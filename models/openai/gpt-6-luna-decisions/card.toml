qualifications = [
  { source_url = "https://vercel.com/docs/ai-gateway/sdks-and-apis/openai-decisions", notes = "This compatible contract accepts one to 255 choices, rejects a boolean and its string spelling in the same question, and accepts inline data URLs only. These differ from the native reference. Scores use two to ten ordered levels; answers preserve question order, and refused questions are billed for input normally." },
  { source_url = "https://ai-gateway.vercel.sh/v1/models/openai/gpt-6-luna-decisions/endpoints", notes = "The endpoint feed reports a 1050000-token context and input price of 0.0000001 USD/token, with zero completion cost and no implicit caching. It publishes no decision-specific long-context bands. Native OpenAI bands are not substituted for unrecorded provider bands." },
  { source_url = "https://ai-gateway.vercel.sh/v1/models/openai/gpt-6-luna-decisions/endpoints", notes = "The generic discovery architecture advertises text-only input and ordinary generation/reasoning parameters, conflicting with the exact Decisions contract's text/image inputs and bounded questions. Contract-specific facts here follow the Decisions documentation; chat parameters are not inherited from generic metadata." },
]

