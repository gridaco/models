[decision_contract]
source_url = "https://developers.openai.com/api/docs/guides/decisions"
question_types = ["predicate", "choice", "score"]
input_forms = ["string", "user_messages"]
question_container = "array"

[providers.openai]
provider = "openai"
id = "gpt-6-luna"
url = "https://developers.openai.com/api/docs/guides/decisions"
source_url = "https://developers.openai.com/api/reference/resources/decisions/methods/create"
qualifications = [
  { source_url = "https://developers.openai.com/api/docs/guides/decisions", notes = "Decisions is a distinct offering of GPT-6 Luna. The decision price is input-only: no output-token, cache-read or cache-write charges. Regional processing premiums and long-context input multipliers still apply." },
  { source_url = "https://developers.openai.com/api/docs/pricing", notes = "The Standard pricing table defines short context as at most 272000 input tokens and long context above that boundary; GPT-6 Luna's input multiplier is two. The recorded tiers cover global Standard processing, excluding regional and other processing-tier modifiers." },
  { source_url = "https://developers.openai.com/api/docs/guides/decisions", notes = "The guide requires inline base64 image data URLs and rejects hosted URLs, while the exact Decisions API reference also documents publicly accessible HTTP(S) image URLs. Inline images agree across both sources; external-URL support is unresolved and no complete image-input-forms list is recorded on this binding." },
  { source_url = "https://developers.openai.com/api/reference/resources/decisions/methods/create", notes = "Predicates estimate the probability of a statement; choice answers retain typed values and per-option probabilities; scores are probability-weighted averages of ordered level indices. A refusal replaces only that question's answer, not the whole response. These are estimates, not application-specific calibration guarantees." },
]

[providers.openai.token_pricing]
source_url = "https://developers.openai.com/api/docs/guides/decisions"
unit = "usd_per_token"
scope = "Global Standard Decisions processing; regional processing and other processing tiers excluded. No cache-read, cache-write or output charges."
input = "0.0000001"
output = "0"
input_cache_read = "0"
input_cache_write = "0"
tiers = [
  { meter = "input", minimum_input_tokens = 0, maximum_input_tokens = 272001, usd_per_token = "0.0000001" },
  { meter = "input", minimum_input_tokens = 272001, usd_per_token = "0.0000002" },
]

[providers.openai.capabilities]
source_url = "https://developers.openai.com/api/docs/guides/decisions"
image_input = true

[providers.openai.decision_contract]
source_url = "https://developers.openai.com/api/reference/resources/decisions/methods/create"
question_types = ["predicate", "choice", "score"]
input_forms = ["string", "user_messages"]
question_container = "array"
image_details = ["low", "high", "auto", "original"]
maximum_images = 128
minimum_choices = 2
maximum_choices = 255
typed_choice_values = true
partial_refusals = true

